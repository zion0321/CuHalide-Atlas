      <stop offset="0" stop-color="#071e30"/>
      <stop offset="0.68" stop-color="#0d374e"/>
      <stop offset="1" stop-color="#13586a"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="16%" r="58%">
      <stop offset="0" stop-color="#5bb9ad" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5bb9ad" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(82 82)">
