name: One-time UI 51 accessibility patch

on:
  push:
    branches:
      - fix/public-ui-simplify-and-resolve
    paths:
      - .github/workflows/patch-ui-r9-a11y.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/public-ui-simplify-and-resolve
      - name: Patch UI adapter without weakening CSP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/ui-r9.js')
          s=p.read_text()
          old=s
          s=s.replace("  x=all(x,'.kpis{display:grid;grid-template-columns:repeat(5,1fr);','.kpis{display:grid;grid-template-columns:repeat(4,1fr);');\n",'')
          s=s.replace("  x=all(x,'.kpis{grid-template-columns:repeat(3,1fr)}.dashboard','.kpis{grid-template-columns:repeat(2,1fr)}.dashboard');\n",'')
          s=s.replace(' style="margin-top:12px"','')
          anchor="  x=all(x,'/ui-assistant-v48-5.css?v=20260818','/ui-assistant-v51.css?v=51.0');\n"
          addition=anchor+"  if(!x.includes('/ui-v51-public-fixes.css?v=51.0'))x=x.replace('</head>','<link rel=\"stylesheet\" href=\"/ui-v51-public-fixes.css?v=51.0\"></head>');\n"
          if anchor not in s: raise SystemExit('asset anchor missing')
          s=s.replace(anchor,addition,1)
          if s==old: raise SystemExit('no UI patch applied')
          for forbidden in ["x=all(x,'.kpis{display:grid;grid-template-columns:repeat(5,1fr);'", "x=all(x,'.kpis{grid-template-columns:repeat(3,1fr)}.dashboard'", 'style="margin-top:12px"']:
              if forbidden in s: raise SystemExit(f'forbidden inline mutation remains: {forbidden}')
          if '/ui-v51-public-fixes.css?v=51.0' not in s: raise SystemExit('public fixes asset missing')
          p.write_text(s)
          PY
          git diff --check
          git diff -- api/ui-r9.js
      - name: Commit targeted patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/ui-r9.js
          git commit -m 'Fix UI 51 CSP and accessibility regressions'
          git push origin HEAD:fix/public-ui-simplify-and-resolve
