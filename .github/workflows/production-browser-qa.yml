name: Production browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: production-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUHALIDE_BASE_URL: https://cuhalide-atlas-v3.vercel.app
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run rev.9 repository and deployment preflight contracts
        run: npm run qa:preflight
      - name: Validate rev.9 backend readiness before merge
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url='https://tyxnyjyrfzspwcfjpzus.supabase.co/functions/v1/cuhalide-atlas-runtime-contract-v1-public?action=health';
          const r=await fetch(url,{headers:{accept:'application/json'}}); if(!r.ok) throw new Error(`backend health ${r.status}`);
          const x=await r.json();
          const c=x.current_curated?.counts||{};
          const expected={article_audit_records:383,chemically_included_articles:372,canonical_verified_articles:370,structure_phase_rows:947,core_included_structure_rows:890,resolved_space_group_rows:747,verified_space_group_rows:720,verified_polar_rows:101,strict_polar_rows:91,strict_polar_articles:57,rag_documents:1330,rag_embedded:1330,taxonomy_rows:947};
          if(x.ok!==true||x.current_curated?.live_revision!==9) throw new Error('rev.9 backend is not ready');
          for(const [k,v] of Object.entries(expected)) if(c[k]!==v) throw new Error(`${k}: expected ${v}, got ${c[k]}`);
          if(x.motif_atlas?.resolved!==663||x.motif_atlas?.unresolved!==284||x.motif_atlas?.geometry_resolved!==217) throw new Error('Motif Atlas final state mismatch');
          if(x.photophysics?.version!=='1.4.0'||x.photophysics?.two_pass_verified_articles!==329||x.photophysics?.verified_no_data_articles!==54||x.photophysics?.pass_a_curated_articles!==0) throw new Error('Photophysics 1.4.0 terminal state mismatch');
          if(x.organic_components?.version!=='1.2.0'||x.organic_components?.database_authority!==true) throw new Error('Organic Components 1.2.0 mismatch');
          console.log('Current Curated rev.9 backend readiness PASS');
          NODE
      - name: Install locked Chromium
        if: github.event_name != 'pull_request'
        run: npx playwright install chromium
      - name: Run full post-merge production rev.9 browser QA
        if: github.event_name != 'pull_request'
        run: npm run qa:browser
      - name: Upload browser report and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-browser-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
