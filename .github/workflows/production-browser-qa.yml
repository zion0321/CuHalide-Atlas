name: Production browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: production-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUHALIDE_BASE_URL: https://cuhalide-atlas-v3.vercel.app
      CUHALIDE_PREMERGE_PRODUCTION: ${{ github.event_name == 'pull_request' }}
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository and deployment preflight contracts
        run: npm run qa:preflight
      - name: Install locked Chromium
        run: npx playwright install chromium
      - name: Run pre-merge production rev.7 backend readiness
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.CUHALIDE_BASE_URL;
          const r=await fetch(`${base}/health.json`,{headers:{accept:'application/json'}});
          if(!r.ok) throw new Error(`production health ${r.status}`);
          const x=await r.json();
          const fail=(m)=>{throw new Error(m)};
          if(x.ok!==true) fail('production health is not OK');
          if(x.current_curated?.live_revision!==7) fail(`expected production rev.7, got ${x.current_curated?.live_revision}`);
          const c=x.current_curated?.counts||{};
          for(const [k,v] of Object.entries({structure_phase_rows:946,core_included_structure_rows:886,resolved_space_group_rows:710,verified_space_group_rows:684,strict_polar_rows:87,strict_polar_articles:54,rag_documents:1329,rag_embedded:1329})) if(c[k]!==v) fail(`production ${k}: expected ${v}, got ${c[k]}`);
          if(x.meta_version!=='50.3'&&x.gateway_meta_version!=='50.3') fail(`pre-merge production Meta must remain 50.3, got ${x.meta_version||x.gateway_meta_version}`);
          if(x.public_data_version!=='2.15.0') fail(`pre-merge production Public Data must remain 2.15.0, got ${x.public_data_version}`);
          if(x.photophysics_contract_version!=='1.2.0') fail(`pre-merge production photophysics must remain 1.2.0, got ${x.photophysics_contract_version}`);
          if(x.photophysics?.version!=='1.2.0'||x.photophysics?.two_pass_gate!==true) fail('pre-merge production two-pass photophysics 1.2.0 baseline is not intact');
          console.log('Pre-merge production rev.7 / Meta 50.3 / Public Data 2.15.0 / Photophysics 1.2.0 baseline PASS');
          NODE
      - name: Run full post-merge production browser QA
        if: github.event_name != 'pull_request'
        run: npm run qa:browser
      - name: Upload browser report and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-browser-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30