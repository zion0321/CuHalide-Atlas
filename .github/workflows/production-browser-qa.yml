name: Production browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: production-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUHALIDE_BASE_URL: https://cuhalide-atlas-v3.vercel.app
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run rev.10 repository and deployment preflight contracts
        run: npm run qa:preflight
      - name: Validate rev.10 backend readiness before merge
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url='https://tyxnyjyrfzspwcfjpzus.supabase.co/functions/v1/cuhalide-atlas-runtime-contract-v1-public?action=health';
          let r=null,last=null;
          for(let i=0;i<3;i++){try{r=await fetch(url,{headers:{accept:'application/json'},signal:AbortSignal.timeout(i===0?6000:i===1?8000:10000)});if(r.ok)break;last=new Error(`backend health ${r.status}`)}catch(e){last=e}if(i<2)await new Promise(resolve=>setTimeout(resolve,180*(i+1)))}
          if(!r?.ok)throw last||new Error('backend health unavailable');
          const x=await r.json();
          const c=x.current_curated?.counts||{};
          const expected={article_audit_records:383,chemically_included_articles:372,canonical_verified_articles:372,structure_phase_rows:939,core_included_structure_rows:901,resolved_space_group_rows:761,verified_space_group_rows:734,verified_polar_rows:101,strict_polar_rows:94,strict_polar_articles:60,rag_documents:1322,rag_embedded:1322,taxonomy_rows:939};
          if(x.ok!==true||x.current_curated?.live_revision!==10) throw new Error('rev.10 backend is not ready');
          for(const [k,v] of Object.entries(expected)) if(c[k]!==v) throw new Error(`${k}: expected ${v}, got ${c[k]}`);
          if(x.photophysics?.ok!==true||x.photophysics?.version!=='1.4.0') throw new Error('Photophysics 1.4.0 health mismatch');
          if(x.organic_components?.ok!==true||x.organic_components?.version!=='1.2.0'||x.organic_components?.database_authority!==true) throw new Error('Organic Components 1.2.0 mismatch');
          const checks=x.checks||{};
          for(const k of ['current_curated_contract','rag_embeddings_complete','rag_content_hashes_valid','taxonomy_one_to_one','organic_structure_state_closed','component_connectivity_state_closed','photophysics_contract']) if(checks[k]!==true) throw new Error(`${k} is not ready`);
          console.log('Current Curated rev.10 backend readiness PASS');
          NODE
      - name: Install locked Chromium
        if: github.event_name != 'pull_request'
        run: npx playwright install chromium
      - name: Run full post-merge production rev.10 browser QA
        if: github.event_name != 'pull_request'
        run: npm run qa:browser
      - name: Upload browser report and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-browser-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
