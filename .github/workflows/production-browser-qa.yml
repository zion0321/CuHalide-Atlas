name: Production browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: production-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUHALIDE_BASE_URL: https://cuhalide-atlas-v3.vercel.app
      CUHALIDE_PREMERGE_PRODUCTION: ${{ github.event_name == 'pull_request' }}
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify production deployment gate logic
        run: npm run qa:deployment-gate

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run pre-merge production scientific baseline
        if: github.event_name == 'pull_request'
        run: >-
          npm run qa:browser -- --grep
          "Current Curated default and Frozen scope denominators are independently exact|Record 13 remains frozen-correct"

      - name: Run full post-merge production browser QA
        if: github.event_name != 'pull_request'
        run: npm run qa:browser

      - name: Upload browser report and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-browser-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
