name: Production browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: production-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUHALIDE_BASE_URL: https://cuhalide-atlas-v3.vercel.app
      CUHALIDE_PREMERGE_PRODUCTION: ${{ github.event_name == 'pull_request' }}
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run repository and deployment preflight contracts
        run: npm run qa:preflight
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run pre-merge production rev.7 backend readiness
        if: github.event_name == 'pull_request'
        run: npm run qa:browser -- --grep "pre-merge production backend rev.7 is ready"
      - name: Run full post-merge production browser QA
        if: github.event_name != 'pull_request'
        run: npm run qa:browser
      - name: Upload browser report and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-browser-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
