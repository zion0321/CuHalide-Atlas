name: Production browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: production-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUHALIDE_BASE_URL: https://cuhalide-atlas-v3.vercel.app
      CUHALIDE_PREMERGE_PRODUCTION: ${{ github.event_name == 'pull_request' }}
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run live production browser QA
        run: npm run qa:browser

      - name: Upload browser report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
