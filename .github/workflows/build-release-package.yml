name: Build CuHalide Atlas 3.0.1 release package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-release-package.yml"
      - "scripts/build_release_package.py"
      - "scripts/build_release_package_runner.py"
      - "api/export.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cuhalide-atlas-release-3.0.1
  cancel-in-progress: false

jobs:
  build-release-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate package
        run: python scripts/build_release_package_runner.py

      - name: Verify ZIP checksum
        run: |
          cd dist
          sha256sum -c CuHalide_Atlas_3.0.1_release_package.zip.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CuHalide-Atlas-3.0.1-release-package
          path: |
            dist/CuHalide_Atlas_3.0.1_release_package.zip
            dist/CuHalide_Atlas_3.0.1_release_package.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Create or update GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.0.1 >/dev/null 2>&1; then
            gh release upload v3.0.1 \
              dist/CuHalide_Atlas_3.0.1_release_package.zip \
              dist/CuHalide_Atlas_3.0.1_release_package.zip.sha256 \
              --clobber
            gh release edit v3.0.1 \
              --title "CuHalide Atlas 3.0.1" \
              --notes-file build/CuHalide_Atlas_3.0.1_release_package/RELEASE_NOTES.md
          else
            gh release create v3.0.1 \
              dist/CuHalide_Atlas_3.0.1_release_package.zip \
              dist/CuHalide_Atlas_3.0.1_release_package.zip.sha256 \
              --target "${GITHUB_SHA}" \
              --title "CuHalide Atlas 3.0.1" \
              --notes-file build/CuHalide_Atlas_3.0.1_release_package/RELEASE_NOTES.md
          fi
