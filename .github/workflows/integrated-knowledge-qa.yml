name: Integrated knowledge QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'lib/**'
      - 'public/**'
      - 'tests/integrated-knowledge.test.mjs'
      - 'scripts/qa-integrated-knowledge.mjs'
      - '.github/workflows/integrated-knowledge-qa.yml'
permissions:
  contents: read

concurrency:
  group: integrated-knowledge-qa-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  integrated-knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - run: node --test tests/integrated-knowledge.test.mjs
      - run: node scripts/qa-integrated-knowledge.mjs
      - name: Preserve implementation without dependencies or secrets
        if: always()
        run: |
          mkdir -p integrated-qa
          git archive --format=zip HEAD -o integrated-qa/source.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: integrated-knowledge-${{ github.event.pull_request.head.sha }}
          path: integrated-qa/
          if-no-files-found: warn
          retention-days: 30
