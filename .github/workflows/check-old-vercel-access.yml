name: Verify historical Vercel deployment access

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-old-vercel-access.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test unauthenticated deployment URLs
        shell: bash
        run: |
          set -u
          old="https://cuhalide-atlas-v3-canto0ccf-3297465039-4630s-projects.vercel.app"
          for path in "/" "/api/data?action=articles&limit=1" "/api/export?action=package-index"; do
            echo "=== $old$path ==="
            curl -sS -D - -o /tmp/body --max-time 30 "$old$path" | grep -Ei '^(HTTP/|location:|x-vercel-|set-cookie:)' || true
            head -c 120 /tmp/body | tr '\n' ' '; echo
          done
