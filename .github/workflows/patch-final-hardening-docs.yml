name: Patch final hardening documentation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'hardening/v48-final-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Synchronize final hardening documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text()
          def write(p, s): Path(p).write_text(s)

          p='README.md'; s=read(p)
          if '## Final production hardening and reproducible operations' not in s:
              marker='## Browser-level production QA\n'
              if marker not in s: raise SystemExit('README browser QA marker missing')
              block='''## Final production hardening and reproducible operations

The v48 production hardening pass also closes deployment and long-term maintenance gaps that are separate from the frozen scientific corpus:

- canonical GitHub Supabase sources now match the deployed **3.0.2 / 2.7.0 / 9.12.0 / 48.0** public runtime, and the release-specific v302 compatibility services plus required validated internal RAG dependencies are versioned for disaster recovery;
- QA dependencies are locked by `package-lock.json`, and both browser and Lighthouse workflows install with `npm ci`;
- a scheduled Lighthouse gate covers mobile/desktop performance, accessibility, best practices, SEO, LCP and CLS in addition to the Playwright/Axe scientific browser gate;
- stable crawlable record URLs are available as `/article/<record_id>` and `/structure/<structure_id>`, with canonical metadata, schema.org JSON-LD and a release-aware dynamic sitemap;
- the retired `/api/export` route remains **410 Gone** and now carries the current frozen release identity;
- the article halogen filter explicitly distinguishes single-halogen containment semantics from exact mixed-halogen categories;
- the daily machine discovery monitor is JWT-gated plus a separate private cron-token factor, uses a 30-day rolling lookback and multiple Crossref/OpenAlex query families, and still writes only to the metadata candidate queue;
- obsolete debug, temporary, ephemeral and bulk-export Edge Functions have been neutralized as JWT-required `410 Gone` stubs; required runtime dependencies are enumerated in `docs/SUPABASE_EDGE_FUNCTION_INVENTORY_V48_2026-08-11.md`;
- health and browser regression allow future **Current Curated revision > 0** while keeping frozen 3.0.2 counts independently fixed.

The public portal therefore has two distinct notions of freshness: immutable frozen-release provenance and a separately tracked rolling Current Curated layer. New metadata candidates never cross that boundary automatically.

'''
              s=s.replace(marker,block+marker); write(p,s)

          p='docs/PRODUCTION_STATUS_V48_2026-08-11.md'; s=read(p)
          if '## Final hardening closure' not in s:
              s=s.rstrip()+'''\n\n## Final hardening closure

The final v48 hardening pass adds operational reproducibility and public-discovery improvements without changing the frozen 3.0.2 scientific corpus:

- GitHub canonical Supabase wrappers and release-specific v302 services are synchronized with production; required internal RAG dependencies are snapshotted and inventoried.
- `package-lock.json` now locks the QA dependency graph; browser and Lighthouse workflows use `npm ci`.
- A scheduled production Lighthouse gate complements Playwright/Axe with mobile/desktop performance, accessibility, best-practices, SEO, LCP and CLS thresholds.
- Stable public record URLs and a dynamic sitemap make canonical article and structure records crawlable without exposing private provenance.
- Homepage structured/social metadata is release-aligned; article halogen filtering now states its containment-versus-exact-category semantics explicitly.
- The retired bulk export route remains 410 and identifies release 3.0.2 consistently.
- Daily machine literature discovery is protected by platform JWT verification plus a separate private cron token, scans a 30-day rolling window with multiple Crossref/OpenAlex query families, and remains metadata-only.
- Obsolete debug/temp/ephemeral/export Edge Functions were replaced with JWT-required 410 retirement stubs; no required production dependency was retired.
- Production health accepts future Current Curated revisions while preserving frozen release denominators.

The machine discovery hardening was validated by a successful JWT+token pg_cron-style invocation on 2026-08-11; the resulting records remain candidate metadata only and do not modify Frozen Release or Current Curated.
'''; write(p,s)

          p='CHANGELOG.md'; s=read(p)
          if '### Final v48 reproducibility and discovery hardening' not in s:
              marker='### Production QA and security\n'
              if marker not in s: raise SystemExit('CHANGELOG QA marker missing')
              block='''### Final v48 reproducibility and discovery hardening

- Synchronized canonical GitHub Supabase wrappers and release-specific v302 runtime sources with the deployed production contracts.
- Snapshotted required validated internal RAG dependencies and added an explicit production/retirement inventory.
- Added `package-lock.json`; production browser and Lighthouse CI now use `npm ci`.
- Added scheduled mobile/desktop Lighthouse thresholds for performance, accessibility, best practices, SEO, LCP and CLS.
- Added stable server-rendered `/article/:id` and `/structure/:id` pages plus a dynamic canonical sitemap.
- Aligned JSON-LD/social metadata to 2026-08-11 and added a branded social preview asset.
- Clarified article halogen filter semantics: single-halogen values use containment, while mixed-halogen labels are exact categories.
- Kept `/api/export` at HTTP 410 while aligning its release identity to 3.0.2.
- Hardened daily metadata discovery with Supabase JWT verification plus a distinct private cron token; expanded the automated sweep to a 30-day rolling window and multiple Crossref/OpenAlex query families.
- Replaced obsolete debug/temp/ephemeral/bulk-export Edge Functions with JWT-required 410 retirement stubs.
- Relaxed only the Current Curated health invariant from revision=0 to revision>=0 so future reviewed additions cannot invalidate frozen 3.0.2 provenance.

'''
              s=s.replace(marker,block+marker); write(p,s)

          p='docs/SUPABASE_EDGE_FUNCTION_INVENTORY_V48_2026-08-11.md'; s=read(p)
          old='`cuhalide-atlas-candidates-v2` | Internal candidate/status reader used by public Literature Watch projection | Yes | v4 / `59334d5a014c00f5e051bccf29f1498432cb980605a86b312bc49f33f571a3b5`'
          new='`cuhalide-atlas-candidates-v2` | Internal candidate/status reader used by public Literature Watch projection | Yes | v5 / contract 2.3.0 / `44f6ce472b429f348fb4d3c03d186b10af313335b06de02b567390e0939fc18b`'
          if 'v5 / contract 2.3.0' not in s:
              if old not in s: raise SystemExit('Candidate inventory row was not found')
              s=s.replace(old,new); write(p,s)
          PY
          git rm .github/workflows/patch-final-hardening-docs.yml
          git diff --check

      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Document final v48 hardening closure'
          git push origin HEAD:${{ github.head_ref }}
