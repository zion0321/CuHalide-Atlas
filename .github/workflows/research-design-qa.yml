name: Research design companion QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/research-design.*'
      - 'scripts/qa-research-design.mjs'
      - '.github/workflows/research-design-qa.yml'
      - 'api/ui-r10.js'
permissions:
  contents: read
jobs:
  research-design-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - run: node scripts/qa-research-design.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: research-design-companion-${{ github.event.pull_request.head.sha }}
          path: research-design-qa/
          if-no-files-found: warn
          retention-days: 30
