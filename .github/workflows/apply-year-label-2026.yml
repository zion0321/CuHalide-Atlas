name: Apply 2026 publication-axis label patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-year-label-2026.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch publication-year display and recompute CSP hashes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const indexPath = 'public/index.html';
          const vercelPath = 'vercel.json';
          let html = fs.readFileSync(indexPath, 'utf8');

          function once(from, to, label) {
            const first = html.indexOf(from);
            if (first < 0) throw new Error(`Missing expected ${label}`);
            if (html.indexOf(from, first + from.length) >= 0) throw new Error(`Expected one ${label}, found multiple`);
            html = html.replace(from, to);
          }

          once(
            'Display window 2006–2026.06 · earlier canonical records remain indexed',
            'Display window 2006–2026 · 2026 is a partial year and updates as newly curated literature is added',
            'publication-window label'
          );
          once(
            'Annual counts of canonical verified Cu(I) halide publications from 2006 through June 2026',
            'Annual counts of canonical verified Cu(I) halide publications from 2006 through 2026; the current year may be partial',
            'publication-chart aria label'
          );
          once(
            "const lab=x.year===2026?'2026.06':x.year;",
            "const lab=x.year===2026?'2026':x.year;",
            '2026 bar label'
          );

          fs.writeFileSync(indexPath, html);

          const sha = (s) => `'sha256-${crypto.createHash('sha256').update(s).digest('base64')}'`;
          const styles = [...html.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi)].map(m => sha(m[1]));
          const scripts = [...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(m => !/\bsrc\s*=/i.test(m[1] || ''))
            .map(m => sha(m[2]));
          if (styles.length !== 1) throw new Error(`Expected one inline style block, found ${styles.length}`);
          if (scripts.length < 1) throw new Error('Expected at least one inline script block');

          const config = JSON.parse(fs.readFileSync(vercelPath, 'utf8'));
          let changed = 0;
          for (const rule of config.headers || []) {
            if (!['/', '/index.html'].includes(rule.source)) continue;
            const h = (rule.headers || []).find(x => x.key === 'Content-Security-Policy');
            if (!h) throw new Error(`Missing CSP header for ${rule.source}`);
            h.value = h.value
              .replace(/style-src-elem [^;]+;/, `style-src-elem 'self' ${styles.join(' ')};`)
              .replace(/script-src [^;]+;/, `script-src 'self' ${scripts.join(' ')};`);
            changed++;
          }
          if (changed !== 2) throw new Error(`Expected two CSP header rules, changed ${changed}`);
          fs.writeFileSync(vercelPath, JSON.stringify(config, null, 2) + '\n');
          NODE

          grep -q 'Display window 2006–2026 · 2026 is a partial year' public/index.html
          grep -q "x.year===2026?'2026':x.year" public/index.html
          ! grep -q 'Display window 2006–2026.06' public/index.html

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-year-label-2026.yml
          git add public/index.html vercel.json
          git diff --cached --check
          git commit -m 'Show 2026 as the current publication year'
          git push origin HEAD:main
