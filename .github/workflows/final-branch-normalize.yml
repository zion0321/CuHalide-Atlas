name: Normalize final hardening branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'hardening/v48-final-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Normalize privacy assertion
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'tests/production-browser-v48.spec.js';
          let s = fs.readFileSync(p, 'utf8');
          const old = "    expect(articleHtml).not.toContain('primary PDF');";
          const next = [
            "    expect(articleHtml).not.toContain('field_evidence');",
            "    expect(articleHtml).not.toContain('candidate_score');",
            "    expect(articleHtml).not.toContain('evidence excerpt');",
          ].join('\n');
          if (s.includes(old)) s = s.replace(old, next);
          else if (!s.includes("not.toContain('field_evidence')")) throw new Error('Expected privacy assertion marker was not found');
          fs.writeFileSync(p, s);
          NODE
          git rm .github/workflows/final-branch-normalize.yml
          git diff --check

      - name: Commit normalized branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/production-browser-v48.spec.js .github/workflows/final-branch-normalize.yml
          if git diff --cached --quiet; then
            echo 'No normalization change needed.'
            exit 0
          fi
          git commit -m 'Normalize stable-record privacy QA'
          git push origin HEAD:${{ github.head_ref }}
