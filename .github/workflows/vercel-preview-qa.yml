name: Vercel preview QA

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: vercel-preview-qa-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  preview-chromium:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview' &&
      (github.event.deployment_status.environment_url != '' || github.event.deployment_status.target_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUHALIDE_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      CUHALIDE_PREMERGE_PRODUCTION: 'false'
      CI: 'true'
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run full browser, scientific, privacy and accessibility QA against Vercel preview
        run: npm run qa:browser

      - name: Upload preview browser report and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-preview-browser-${{ github.event.deployment.sha }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

  preview-lighthouse:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview' &&
      (github.event.deployment_status.environment_url != '' || github.event.deployment_status.target_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUHALIDE_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      CI: 'true'
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse gate against Vercel preview
        run: npm run qa:lighthouse

      - name: Upload preview Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-preview-lighthouse-${{ github.event.deployment.sha }}-${{ github.run_id }}
          path: lighthouse-report/
          if-no-files-found: warn
          retention-days: 30
