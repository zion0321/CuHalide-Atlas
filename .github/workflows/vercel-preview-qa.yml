name: Vercel preview QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-preview-qa-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  preview-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUHALIDE_BASE_URL: http://127.0.0.1:4173
      CI: 'true'
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Attest candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -f api/ui-r9.js
          test -f api/meta-r9.js
          test -f scripts/local-candidate-server.mjs
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run rev.9 repository preflight
        run: npm run qa:preflight
      - name: Start exact candidate runtime locally
        shell: bash
        run: |
          set -euo pipefail
          node scripts/local-candidate-server.mjs > candidate-server.log 2>&1 &
          echo $! > candidate-server.pid
          for i in $(seq 1 45); do
            rm -f /tmp/cuhalide-candidate-ready.headers
            if curl --fail --silent --show-error --dump-header /tmp/cuhalide-candidate-ready.headers --output /dev/null "$CUHALIDE_BASE_URL/__qa/ready" && grep -qi '^x-cuhalide-candidate-ready: 1' /tmp/cuhalide-candidate-ready.headers; then exit 0; fi
            sleep 1
          done
          cat candidate-server.log >&2 || true
          exit 1
      - name: Install locked Chromium
        run: npx playwright install chromium
      - name: Run rev.9 browser and privacy regression gate
        run: npm run qa:site-quality
      - name: Stop local candidate runtime
        if: always()
        shell: bash
        run: |
          if [ -f candidate-server.pid ]; then kill "$(cat candidate-server.pid)" 2>/dev/null || true; fi
      - name: Upload candidate browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preview-candidate-browser-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            candidate-server.log
          if-no-files-found: warn
          retention-days: 30

  preview-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUHALIDE_BASE_URL: http://127.0.0.1:4173
      CI: 'true'
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run rev.9 repository preflight
        run: npm run qa:preflight
      - name: Start exact candidate runtime locally
        shell: bash
        run: |
          set -euo pipefail
          node scripts/local-candidate-server.mjs > candidate-server.log 2>&1 &
          echo $! > candidate-server.pid
          for i in $(seq 1 45); do
            if curl --fail --silent --output /dev/null "$CUHALIDE_BASE_URL/__qa/ready"; then exit 0; fi
            sleep 1
          done
          cat candidate-server.log >&2 || true
          exit 1
      - name: Install locked Chromium
        run: npx playwright install chromium
      - name: Run Lighthouse gate against exact rev.9 candidate runtime
        run: npm run qa:lighthouse
      - name: Stop exact candidate runtime
        if: always()
        shell: bash
        run: |
          if [ -f candidate-server.pid ]; then kill "$(cat candidate-server.pid)" 2>/dev/null || true; fi
      - name: Upload candidate Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preview-candidate-lighthouse-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            lighthouse-report/
            candidate-server.log
          if-no-files-found: warn
          retention-days: 30
