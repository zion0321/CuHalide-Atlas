name: Vercel preview QA

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: vercel-preview-qa-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  preview-chromium:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview' &&
      (github.event.deployment_status.environment_url != '' || github.event.deployment_status.target_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_PREVIEW_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      CUHALIDE_BASE_URL: http://127.0.0.1:4173
      CUHALIDE_PREMERGE_PRODUCTION: 'false'
      CI: 'true'
    steps:
      - name: Checkout exact Vercel-deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Attest Vercel preview provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.deployment.sha }}"
          case "$VERCEL_PREVIEW_URL" in
            https://*.vercel.app*) ;;
            *) echo "Unexpected preview URL: $VERCEL_PREVIEW_URL" >&2; exit 1 ;;
          esac
          test -f scripts/local-candidate-server.mjs

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Start exact candidate runtime locally
        shell: bash
        run: |
          set -euo pipefail
          node scripts/local-candidate-server.mjs > candidate-server.log 2>&1 &
          echo $! > candidate-server.pid
          for i in $(seq 1 45); do
            if curl --fail --silent --show-error "$CUHALIDE_BASE_URL/health.json" > /tmp/cuhalide-candidate-health.json; then
              cat /tmp/cuhalide-candidate-health.json
              exit 0
            fi
            sleep 1
          done
          cat candidate-server.log >&2 || true
          exit 1

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run full candidate browser, scientific, privacy and accessibility QA
        run: npm run qa:browser

      - name: Stop local candidate runtime
        if: always()
        shell: bash
        run: |
          if [ -f candidate-server.pid ]; then kill "$(cat candidate-server.pid)" 2>/dev/null || true; fi

      - name: Upload candidate browser report and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-preview-candidate-browser-${{ github.event.deployment.sha }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            candidate-server.log
          if-no-files-found: warn
          retention-days: 30

  preview-lighthouse:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview' &&
      (github.event.deployment_status.environment_url != '' || github.event.deployment_status.target_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_PREVIEW_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      CUHALIDE_BASE_URL: http://127.0.0.1:4173
      CI: 'true'
    steps:
      - name: Checkout exact Vercel-deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Attest Vercel preview provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.deployment.sha }}"
          case "$VERCEL_PREVIEW_URL" in
            https://*.vercel.app*) ;;
            *) echo "Unexpected preview URL: $VERCEL_PREVIEW_URL" >&2; exit 1 ;;
          esac
          test -f scripts/local-candidate-server.mjs

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Start exact candidate runtime locally
        shell: bash
        run: |
          set -euo pipefail
          node scripts/local-candidate-server.mjs > candidate-server.log 2>&1 &
          echo $! > candidate-server.pid
          for i in $(seq 1 45); do
            if curl --fail --silent --show-error "$CUHALIDE_BASE_URL/health.json" > /tmp/cuhalide-candidate-health.json; then
              cat /tmp/cuhalide-candidate-health.json
              exit 0
            fi
            sleep 1
          done
          cat candidate-server.log >&2 || true
          exit 1

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse gate against exact candidate runtime
        run: npm run qa:lighthouse

      - name: Stop local candidate runtime
        if: always()
        shell: bash
        run: |
          if [ -f candidate-server.pid ]; then kill "$(cat candidate-server.pid)" 2>/dev/null || true; fi

      - name: Upload candidate Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-preview-candidate-lighthouse-${{ github.event.deployment.sha }}-${{ github.run_id }}
          path: |
            lighthouse-report/
            candidate-server.log
          if-no-files-found: warn
          retention-days: 30
