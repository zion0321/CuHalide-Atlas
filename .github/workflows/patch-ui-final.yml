name: One-time final UI 51 patch

on:
  push:
    branches:
      - fix/public-ui-simplify-and-resolve
    paths:
      - .github/workflows/patch-ui-final.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/public-ui-simplify-and-resolve
      - name: Consolidate public fixes into the existing UI 51 stylesheet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('api/ui-r9.js')
          s=ui.read_text()
          link="  if(!x.includes('/ui-v51-public-fixes.css?v=51.0'))x=x.replace('</head>','<link rel=\"stylesheet\" href=\"/ui-v51-public-fixes.css?v=51.0\"></head>');\n"
          if link in s:
              s=s.replace(link,'')
          ui.write_text(s)

          css=Path('public/ui-v51-core.css')
          c=css.read_text()
          marker='/* UI51_PUBLIC_SIMPLIFICATION_A11Y */'
          if marker not in c:
              c += '''\n\n/* UI51_PUBLIC_SIMPLIFICATION_A11Y */\n.kpis{grid-template-columns:repeat(4,minmax(0,1fr))!important}\nth{color:#fff!important}\n.polar-num,.polar-num strong,.polar-num small{color:#fff!important}\n.footer-links a{display:inline-flex;align-items:center;min-height:32px;padding:4px 2px}\n@media(max-width:1120px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}}\n@media(max-width:780px){\n  .footer-links{row-gap:8px}\n  .footer-links a{min-height:36px;padding:8px 4px}\n  .view[data-view="structures"] tbody td:nth-child(7)::before{content:"Source"!important}\n  .view[data-view="structures"] tbody td:nth-child(8)::before{content:""!important}\n}\n'''
          css.write_text(c)
          PY
          if [ -f public/ui-v51-public-fixes.css ]; then git rm public/ui-v51-public-fixes.css; fi
          git diff --check
          grep -q 'UI51_PUBLIC_SIMPLIFICATION_A11Y' public/ui-v51-core.css
          ! grep -q 'ui-v51-public-fixes.css' api/ui-r9.js
      - name: Commit final UI patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/ui-r9.js public/ui-v51-core.css
          git commit -m 'Consolidate UI 51 public accessibility fixes'
          git push origin HEAD:fix/public-ui-simplify-and-resolve
