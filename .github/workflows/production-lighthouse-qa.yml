name: Production Lighthouse QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '53 3 * * *'

permissions:
  contents: read

concurrency:
  group: production-lighthouse-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUHALIDE_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173' || 'https://cuhalide-atlas-v3.vercel.app' }}
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked QA dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Start exact pull-request candidate runtime
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/local-candidate-server.mjs > candidate-server.log 2>&1 &
          echo $! > candidate-server.pid
          for i in $(seq 1 45); do
            rm -f /tmp/cuhalide-candidate-ready.headers
            if curl --fail --silent --show-error --dump-header /tmp/cuhalide-candidate-ready.headers --output /dev/null "$CUHALIDE_BASE_URL/__qa/ready" && grep -qi '^x-cuhalide-candidate-ready: 1' /tmp/cuhalide-candidate-ready.headers; then
              echo 'Exact candidate runtime is locally ready; full health remains part of protected QA.'
              exit 0
            fi
            sleep 1
          done
          cat candidate-server.log >&2 || true
          exit 1

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run required Lighthouse quality gate
        run: npm run qa:lighthouse

      - name: Stop exact pull-request candidate runtime
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ -f candidate-server.pid ]; then
            kill "$(cat candidate-server.pid)" 2>/dev/null || true
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-lighthouse-qa-${{ github.run_id }}
          path: |
            lighthouse-report/
            candidate-server.log
          if-no-files-found: warn
          retention-days: 30
