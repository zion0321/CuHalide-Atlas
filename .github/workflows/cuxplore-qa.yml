name: CuXplore source coverage QA
on:
  pull_request:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: cuxplore-qa-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  cuxplore-source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - run: node --test tests/cuxplore-contract.test.mjs tests/integrated-knowledge.test.mjs
      - run: node scripts/qa-cuxplore.mjs
      - name: Preserve tested implementation
        if: always()
        run: git archive HEAD -o cuxplore-qa/source.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cuxplore-source-coverage-${{ github.event.pull_request.head.sha }}
          path: cuxplore-qa/
          retention-days: 30
